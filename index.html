<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maya Tex — HR Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --terracotta:#DB5D3E; --terracotta-dark:#C24A2E;
    --green:#014F28; --green-2:#0A6B3A;
    --ink:#211F1C; --muted:#6E6A63; --line:#E3DDD2;
    --surface:#FFFFFF; --bg:#EDEFEA; --field:#FAF8F4;
    --shadow:0 1px 2px rgba(33,31,28,.06), 0 8px 24px rgba(33,31,28,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Roboto',system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased}

  .topbar{display:flex; align-items:center; gap:14px; padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
  .topbar img{height:34px; width:auto; display:block}
  .topbar .titles{line-height:1.1}
  .topbar h1{font-family:'Play',sans-serif; font-weight:700; font-size:18px; margin:0; color:var(--green); letter-spacing:.2px}
  .topbar .sub{font-size:12px; color:var(--muted); margin-top:2px}
  .topbar .spacer{flex:1}
  .badge{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--green); background:#E4EFE7; border:1px solid #CFE4D5; padding:4px 9px; border-radius:999px}
  .badge.warn{color:#8a4b00; background:#FBEEDD; border-color:#F0D8B4}

  .wrap{display:grid; grid-template-columns:minmax(320px,420px) 1fr; gap:22px; padding:22px; max-width:1400px; margin:0 auto; align-items:start}
  @media (max-width:900px){ .wrap{grid-template-columns:1fr; padding:14px; gap:16px} }

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .panel .phead{padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .panel .phead h2{font-family:'Play',sans-serif; font-size:15px; margin:0; color:var(--ink)}
  .panel .pbody{padding:16px}

  .eyebrow{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.9px; color:var(--green); margin:2px 0 10px}
  .eyebrow:not(:first-child){margin-top:22px; padding-top:16px; border-top:1px dashed var(--line)}

  label{display:block; font-size:12.5px; font-weight:500; color:var(--ink); margin:0 0 5px}
  .hint{font-size:11.5px; color:var(--muted); font-weight:400}
  .field, input[type=text], select, textarea{width:100%; font:inherit; font-size:14px; color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:9px; padding:9px 11px; outline:none; transition:border-color .12s, box-shadow .12s}
  textarea{resize:vertical; min-height:70px; line-height:1.45}
  .field:focus, input:focus, select:focus, textarea:focus{border-color:var(--terracotta); box-shadow:0 0 0 3px rgba(219,93,62,.14)}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .fieldgroup{margin-bottom:12px}
  .fieldgroup:last-child{margin-bottom:0}

  .ta{position:relative}
  .ta-list{position:absolute; z-index:30; left:0; right:0; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); max-height:260px; overflow:auto; display:none}
  .ta-list.open{display:block}
  .ta-item{padding:9px 12px; cursor:pointer; font-size:13.5px; display:flex; justify-content:space-between; gap:10px}
  .ta-item:hover, .ta-item.active{background:#F3EFE8}
  .ta-item small{color:var(--muted)}
  .ta-empty{padding:11px 12px; font-size:13px; color:var(--muted)}

  .btnrow{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid transparent; padding:10px 16px; font-weight:600; font-size:14px}
  .btn-ghost{background:#fff; color:var(--ink); border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--terracotta); color:var(--terracotta-dark)}
  .btn-green{background:var(--green); color:#fff}
  .btn-green:hover{background:var(--green-2)}

  .notice{font-size:12.5px; padding:10px 12px; border-radius:9px; margin-bottom:14px; line-height:1.45; background:#FBEEDD; border:1px solid #F0D8B4; color:#7a4a00}
  .notice code{background:#fff; padding:1px 5px; border-radius:4px; border:1px solid #e7d3ad}

  .preview-shell{display:flex; flex-direction:column; gap:12px}
  .preview-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .preview-toolbar .t{font-size:12px; color:var(--muted)}
  .paper-scroll{overflow:auto; border-radius:14px}

  .page{background:#fff; color:#141210; width:210mm; min-height:297mm; margin:0 auto; padding:25.4mm; box-shadow:var(--shadow); display:flex; flex-direction:column; font-family:'Noto Serif',Georgia,serif}
  @media (max-width:900px){ .page{width:100%; min-height:auto; padding:16mm 12mm} }

  /* extra padding between letterhead and body — applies to every letter */
  .lh-header{margin-bottom:34pt}
  .lh-header img{width:58mm; max-width:220px; height:auto; display:block}

  .letter-body{flex:1; font-size:11.5pt; line-height:1.6; color:#1b1916}
  .letter-body table.refline{width:100%; border-collapse:collapse; font-size:10.5pt; color:#3a352f; margin:0 0 22pt}
  .letter-body table.refline td.l{text-align:left}
  .letter-body table.refline td.r{text-align:right}
  .letter-body .subject{font-weight:600; text-align:center; text-decoration:underline; text-underline-offset:3px; margin:6pt 0 18pt; font-size:12pt}
  .letter-body p{margin:0 0 11pt}
  .letter-body .addr{margin:0 0 14pt; white-space:pre-line}

  .letter-body .salary-tbl{border-collapse:collapse; margin:6pt 0 10pt; width:auto; min-width:62%}
  .letter-body .salary-tbl td{padding:5pt 14pt 5pt 0; font-size:11.5pt}
  .letter-body .salary-tbl td.amt{text-align:right; font-variant-numeric:tabular-nums}
  .letter-body .salary-tbl tr.total td{border-top:1px solid #b9b2a6; font-weight:600; padding-top:7pt}
  .letter-body .words{font-style:italic; color:#3a352f; font-size:10.5pt; margin:0 0 12pt}

  .letter-body table.terms{border-collapse:collapse; margin:6pt 0 12pt}
  .letter-body table.terms td{padding:3pt 16pt 3pt 0; font-size:11.5pt; vertical-align:top}
  .letter-body table.terms td.k{white-space:nowrap; color:#3a352f; font-weight:600}

  .letter-body table.items{border-collapse:collapse; width:100%; margin:8pt 0 12pt; font-size:10.8pt}
  .letter-body table.items th, .letter-body table.items td{border:1px solid #cfc7ba; padding:5pt 8pt; text-align:left}
  .letter-body table.items th{background:#F3EFE8; font-weight:600}

  .sign-block{margin-top:26pt}
  .sign-block .for{margin-bottom:34pt}
  .sign-line{width:62mm; border-top:1px solid #2a2620; padding-top:4pt; font-size:10.5pt}

  .letter-body table.sign-two{width:100%; border-collapse:collapse; margin-top:30pt}
  .letter-body table.sign-two td{width:50%; vertical-align:bottom; padding-right:16pt}
  .letter-body table.sign-two .role{font-size:10.5pt; color:#3a352f; margin-bottom:30pt}
  .letter-body table.sign-two .sign-line{width:56mm}

  .lh-footer{margin-top:20pt}
  .lh-footer img{width:130mm; max-width:492px; height:auto; display:block}

  @media print{
    @page{size:A4; margin:0}
    body{background:#fff}
    .topbar,.wrap>.panel,.preview-toolbar,.no-print{display:none !important}
    .wrap{display:block; padding:0; margin:0; max-width:none}
    .paper-scroll{overflow:visible}
    .page{display:block; width:210mm; min-height:297mm; margin:0; box-shadow:none; padding:25.4mm 25.4mm 42mm}
    .letter-body{flex:none}
    .lh-footer{position:fixed; left:25.4mm; right:25.4mm; bottom:14mm; margin:0}
    .lh-footer img{width:130mm; max-width:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <img id="brandLogo" alt="Maya" />
  <div class="titles"><h1>HR Letters</h1><div class="sub">Maya Tex Restaurants Company</div></div>
  <div class="spacer"></div>
  <span id="connBadge" class="badge warn">Manual mode</span>
</div>

<div class="wrap">
  <div class="panel no-print">
    <div class="phead"><h2>Generate a letter</h2></div>
    <div class="pbody">

      <div id="setupNotice" class="notice" style="display:none">
        Roster not connected. Paste your Apps Script <code>/exec</code> URL into <code>API_URL</code>
        at the top of the script, or fill the details in manually below.
      </div>

      <div class="fieldgroup"><label>Letter type</label><select id="letterType"></select></div>

      <div class="eyebrow">Employee</div>
      <div class="fieldgroup ta" id="taWrap">
        <label>Search staff <span class="hint">(type a name)</span></label>
        <input type="text" id="empSearch" autocomplete="off" placeholder="Loading roster…" disabled />
        <div class="ta-list" id="taList"></div>
      </div>
      <div class="row">
        <div class="fieldgroup"><label>Title</label><select id="fTitle"><option>Mr.</option><option>Ms.</option><option>Mrs.</option></select></div>
        <div class="fieldgroup"><label>Nationality <span class="hint">(manual)</span></label><input type="text" id="fNationality" placeholder="e.g. Nepali" /></div>
      </div>
      <div class="fieldgroup"><label>Employee name</label><input type="text" id="fName" placeholder="Full name" /></div>
      <div class="row">
        <div class="fieldgroup"><label>Designation</label><input type="text" id="fDesignation" placeholder="Position" /></div>
        <div class="fieldgroup"><label>Date of joining</label><input type="text" id="fDoj" placeholder="dd-mm-yyyy" /></div>
      </div>
      <div class="row">
        <div class="fieldgroup"><label>Civil ID</label><input type="text" id="fCivilId" placeholder="Civil ID No." /></div>
        <div class="fieldgroup"><label>Passport No. <span class="hint">(optional)</span></label><input type="text" id="fPassport" placeholder="Passport No." /></div>
      </div>

      <div id="dynFields"></div>

      <div class="eyebrow">Letter details</div>
      <div class="row">
        <div class="fieldgroup"><label>Reference No.</label><input type="text" id="fRef" /></div>
        <div class="fieldgroup"><label>Issue date</label><input type="text" id="fDate" placeholder="dd-mm-yyyy" /></div>
      </div>
      <div class="row">
        <div class="fieldgroup"><label>Signatory name</label><input type="text" id="fSignatory" value="Abdulrehman Alnajar" /></div>
        <div class="fieldgroup"><label>Signatory title</label><input type="text" id="fSignTitle" value="General Manager" /></div>
      </div>

      <div class="btnrow">
        <button class="btn-green" id="btnPrint">Print / Save as PDF</button>
        <button class="btn-ghost" id="btnReset">Reset</button>
      </div>
    </div>
  </div>

  <div class="preview-shell">
    <div class="preview-toolbar no-print">
      <span class="t">Live preview — A4. Use <b>Print / Save as PDF</b> for the final letter.</span>
    </div>
    <div class="paper-scroll">
      <div class="page" id="page">
        <div class="lh-header"><img id="lhLogo" alt="Maya Tex" /></div>
        <div class="letter-body" id="letterBody"></div>
        <div class="lh-footer"><img id="lhFooter" alt="" /></div>
      </div>
    </div>
  </div>
</div>

/* ---------- helpers ---------- */
const $=(id)=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayDDMMYYYY(){const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear();}
function num(v){return parseFloat(String(v==null?'':v).replace(/,/g,''));}
function fmtKD(v){const n=num(v);return isNaN(n)?'':n.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});}
function pron(d){const m=d.title==='Mr.';return{He:m?'He':'She',he:m?'he':'she',his:m?'his':'her',him:m?'him':'her'};}
function kdWords(v){const n=num(v);if(isNaN(n))return '';const din=Math.floor(n),fils=Math.round((n-din)*1000);let s='Kuwaiti Dinars '+intWords(din);if(fils>0)s+=' and '+intWords(fils)+' Fils';return s+' only';}
function intWords(num){if(num===0)return 'Zero';const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function u(n){let s='';if(n>=100){s+=o[Math.floor(n/100)]+' Hundred';n%=100;if(n)s+=' ';}if(n>=20){s+=t[Math.floor(n/10)];n%=10;if(n)s+='-'+o[n];}else if(n>0)s+=o[n];return s;}
  let res='';for(const[nm,val]of[['Million',1e6],['Thousand',1e3]]){if(num>=val){res+=u(Math.floor(num/val))+' '+nm+' ';num%=val;}}if(num>0)res+=u(num);return res.trim();}

/* shared letter pieces */
function REF(d){return `<table class="refline"><tr><td class="l">Ref: ${esc(d.fRef)}</td><td class="r">Date: ${esc(d.fDate)}</td></tr></table>`;}
function SUBJ(t){return `<p class="subject">${esc(t)}</p>`;}
function idClause(d){const pass=d.fPassport?` and Passport No. <b>${esc(d.fPassport)}</b>`:'';const nat=d.fNationality?`, a ${esc(d.fNationality)} national,`:',';return `holding Civil ID No. <b>${esc(d.fCivilId)}</b>${pass}${nat}`;}
function salaryBlock(basicRaw,allowRaw,totalRaw,label){label=label||'Total Monthly Salary';let basic=num(basicRaw),allow=num(allowRaw),total=num(totalRaw);if(isNaN(total))total=(isNaN(basic)?0:basic)+(isNaN(allow)?0:allow);let rows='';if(!isNaN(basic))rows+=`<tr><td>Basic Salary</td><td class="amt">KD ${fmtKD(basic)}</td></tr>`;if(!isNaN(allow)&&allow>0)rows+=`<tr><td>Allowances</td><td class="amt">KD ${fmtKD(allow)}</td></tr>`;if(!rows&&(isNaN(total)||total<=0))return '';return `<table class="salary-tbl">${rows}<tr class="total"><td>${esc(label)}</td><td class="amt">KD ${fmtKD(total||0)}</td></tr></table>${total>0?`<p class="words">(${esc(kdWords(total))})</p>`:''}`;}
function itemsTable(text){const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(!lines.length)return '<p><i>[No items entered — one per line: Item — Make/Model — Serial/Plate]</i></p>';const rows=lines.map((l,i)=>{const p=l.split(/\s*[—|\t]\s*|\s+-\s+/).map(x=>x.trim());return `<tr><td>${i+1}</td><td>${esc(p[0]||'')}</td><td>${esc(p[1]||'')}</td><td>${esc(p[2]||'')}</td></tr>`;}).join('');return `<table class="items"><thead><tr><th>#</th><th>Item</th><th>Make / Model</th><th>Serial / Plate / IMEI</th></tr></thead><tbody>${rows}</tbody></table>`;}
function companySign(d,lead){const l=lead?`${esc(lead)} — For <b>Maya Tex Restaurants Company</b>,`:`For <b>Maya Tex Restaurants Company</b>,`;return `<div class="sign-block"><p class="for">${l}</p><div class="sign-line">${esc(d.fSignatory||'Abdulrehman Alnajar')}<br>${esc(d.fSignTitle||'General Manager')}</div></div>`;}
function twoSign(d,empRole,compLead){return `<table class="sign-two"><tr><td><div class="role">${esc(empRole)}:</div><div class="sign-line">${d.title} ${esc(d.fName)}<br>Civil ID: ${esc(d.fCivilId)}</div></td><td><div class="role">${compLead?esc(compLead)+' — ':''}For Maya Tex Restaurants Company,</div><div class="sign-line">${esc(d.fSignatory||'Abdulrehman Alnajar')}<br>${esc(d.fSignTitle||'General Manager')}</div></td></tr></table>`;}

      {key:'allowances',label:'Allowances (KD)',type:'text',placeholder:'optional',hint:'optional'},
      {key:'total',label:'Total salary (KD)',type:'text',placeholder:'auto if blank',hint:'auto = basic + allowances'},
      {key:'purpose',label:'Purpose',type:'text',placeholder:'e.g. bank account opening',hint:'optional'}],
    render(d){const P=pron(d);const twmic=d.addressedTo==='To Whom It May Concern';const addr=(!twmic&&d.addressedTo)?`<p class="addr">${esc(d.addressedTo)}</p>`:'';const sal=salaryBlock(d.basic,d.allowances,d.total);const purpose=d.purpose?` for the purpose of ${esc(d.purpose)}`:'';
      return `${REF(d)}${addr}${SUBJ(twmic?'TO WHOM IT MAY CONCERN':'SALARY CERTIFICATE')}
      <p>This is to certify that <b>${d.title} ${esc(d.fName)}</b>, ${idClause(d)} has been employed with <b>Maya Tex Restaurants Company</b> as <b>${esc(d.fDesignation)}</b> since <b>${esc(d.fDoj)}</b>, and ${P.he} is currently in active service.</p>

/* =============================================================
   State + wiring
============================================================= */
let ROSTER=[], manualFieldValues={};
function currentLetter(){return LETTERS[$('letterType').value];}

function collectData(){
  const d={title:$('fTitle').value,fNationality:$('fNationality').value.trim(),fName:$('fName').value.trim(),
    fDesignation:$('fDesignation').value.trim(),fDoj:$('fDoj').value.trim(),fCivilId:$('fCivilId').value.trim(),
    fPassport:$('fPassport').value.trim(),fRef:$('fRef').value.trim(),fDate:$('fDate').value.trim(),
    fSignatory:$('fSignatory').value.trim(),fSignTitle:$('fSignTitle').value.trim()};
  (currentLetter().fields||[]).forEach(f=>{const el=$('dyn_'+f.key);d[f.key]=el?el.value.trim():'';});
  return d;
}
function renderPreview(){ $('letterBody').innerHTML=currentLetter().render(collectData()); }

function renderDynFields(){
  const L=currentLetter(),host=$('dynFields');
  host.innerHTML=`<div class="eyebrow">${esc(L.label)} details</div>`;
  (L.fields||[]).forEach(f=>{
    const wrap=document.createElement('div');wrap.className='fieldgroup';
    let val=manualFieldValues[f.key];
    if(val==null)val=(f.def==='today'?todayDDMMYYYY():(f.def||''));
    let ctrl;
    if(f.type==='textarea')ctrl=`<textarea id="dyn_${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
    else if(f.type==='select')ctrl=`<select id="dyn_${f.key}">`+(f.options||[]).map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')+`</select>`;
    else ctrl=`<input type="text" id="dyn_${f.key}" placeholder="${esc(f.placeholder||'')}" value="${esc(val)}" />`;
    wrap.innerHTML=`<label>${esc(f.label)} ${f.hint?`<span class="hint">(${esc(f.hint)})</span>`:''}</label>${ctrl}`;
    host.appendChild(wrap);
  });
  (L.fields||[]).forEach(f=>{const el=$('dyn_'+f.key);el.addEventListener(f.type==='select'?'change':'input',e=>{manualFieldValues[f.key]=e.target.value;renderPreview();});});
  $('fRef').value='MT/HR/'+L.code+'/'+new Date().getFullYear()+'/001';
}

function fillFromEmployee(e){
  $('fName').value=e.name||'';$('fDesignation').value=e.designation||'';$('fDoj').value=e.dateOfJoin||'';
  $('fCivilId').value=e.civilId||'';$('fPassport').value=e.passportNo||'';renderPreview();
}

function initTypeahead(){
  const input=$('empSearch'),list=$('taList');let active=-1,shown=[];
  function close(){list.classList.remove('open');active=-1;}
  function open(items){shown=items;if(!items.length){list.innerHTML='<div class="ta-empty">No match</div>';list.classList.add('open');return;}
    list.innerHTML=items.slice(0,40).map((e,i)=>`<div class="ta-item" data-i="${i}"><span>${esc(e.name)}</span><small>${esc(e.designation||'')}</small></div>`).join('');
    list.classList.add('open');active=-1;
    list.querySelectorAll('.ta-item').forEach(el=>el.addEventListener('mousedown',ev=>{ev.preventDefault();pick(+el.dataset.i);}));}
  function pick(i){const e=shown[i];if(!e)return;input.value=e.name;close();fillFromEmployee(e);}
  input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();if(!q){close();return;}open(ROSTER.filter(e=>e.name.toLowerCase().includes(q)));});
  input.addEventListener('keydown',ev=>{const items=list.querySelectorAll('.ta-item');if(!list.classList.contains('open')||!items.length)return;
    if(ev.key==='ArrowDown'){ev.preventDefault();active=Math.min(active+1,items.length-1);}
    else if(ev.key==='ArrowUp'){ev.preventDefault();active=Math.max(active-1,0);}
    else if(ev.key==='Enter'){ev.preventDefault();if(active>=0)pick(active);return;}
    else if(ev.key==='Escape'){close();return;}else return;
    items.forEach((el,i)=>el.classList.toggle('active',i===active));items[active].scrollIntoView({block:'nearest'});});
  document.addEventListener('click',e=>{if(!$('taWrap').contains(e.target))close();});
}

function setConnected(ok,count){const b=$('connBadge');
  if(ok){b.className='badge';b.textContent=count+' staff connected';$('empSearch').disabled=false;$('empSearch').placeholder='Type a name…';$('setupNotice').style.display='none';}
  else{b.className='badge warn';b.textContent='Manual mode';$('empSearch').disabled=true;$('empSearch').placeholder='Manual mode — type details below';$('setupNotice').style.display='block';}}

async function loadRoster(){
  if(!API_URL){setConnected(false);return;}
  try{const res=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'action=roster');const data=await res.json();
    if(data&&data.ok&&Array.isArray(data.staff)){ROSTER=data.staff;setConnected(true,ROSTER.length);}else setConnected(false);
  }catch(e){setConnected(false);}}

function init(){
  $('brandLogo').src=LOGO_SRC;$('lhLogo').src=LOGO_SRC;$('lhFooter').src=FOOTER_SRC;
  const sel=$('letterType');
  sel.innerHTML=Object.entries(LETTERS).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join('');
  sel.addEventListener('change',()=>{manualFieldValues={};renderDynFields();renderPreview();});
  $('fDate').value=todayDDMMYYYY();
  ['fTitle','fNationality','fName','fDesignation','fDoj','fCivilId','fPassport','fRef','fDate','fSignatory','fSignTitle']
    .forEach(id=>$(id).addEventListener('input',renderPreview));
  $('btnPrint').addEventListener('click',()=>window.print());
  $('btnReset').addEventListener('click',()=>{
    ['fNationality','fName','fDesignation','fDoj','fCivilId','fPassport','empSearch'].forEach(id=>$(id).value='');
    $('fSignatory').value='Abdulrehman Alnajar';$('fSignTitle').value='General Manager';
    manualFieldValues={};$('fDate').value=todayDDMMYYYY();renderDynFields();renderPreview();});
  initTypeahead();renderDynFields();renderPreview();loadRoster();
}
document.addEventListener('DOMContentLoaded',init);
</script>
